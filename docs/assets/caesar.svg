<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="caesar-title caesar-desc"><title id="caesar-title">Гай Юлий Цезарь — художественная реконструкция</title><desc id="caesar-desc">Удлинённое лицо, высокий лоб, короткие волосы и лавровая ветвь. Оригинальная стилизованная иллюстрация; не точная копия античного портрета.</desc><defs><linearGradient id="caesar-bg" x2="1" y2="1"><stop stop-color="#173238"/><stop offset=".6" stop-color="#0b171d"/><stop offset="1" stop-color="#080f14"/></linearGradient><linearGradient id="caesar-stone" x1=".1" y1=".1" x2=".9" y2=".8"><stop stop-color="#f4d49e"/><stop offset=".35" stop-color="#b88d5d"/><stop offset=".65" stop-color="#78664f"/><stop offset="1" stop-color="#29464a"/></linearGradient><linearGradient id="caesar-robe" x2="1" y2="1"><stop stop-color="#a98259"/><stop offset=".5" stop-color="#4b534b"/><stop offset="1" stop-color="#112d34"/></linearGradient><linearGradient id="caesar-rim" x2="1" y2="1"><stop stop-color="#edbd79"/><stop offset=".6" stop-color="#bcaa7f"/><stop offset="1" stop-color="#7eddd5"/></linearGradient><radialGradient id="caesar-halo"><stop stop-color="#d0b879" stop-opacity=".13"/><stop offset="1" stop-color="#7eddd5" stop-opacity="0"/></radialGradient></defs>
